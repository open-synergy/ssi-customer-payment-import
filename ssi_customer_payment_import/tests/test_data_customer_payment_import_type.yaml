scenarios:
  - name: "Create Customer Payment Import Type"
    steps:
      - step: "Create type"
        action: "create"
        model: "customer_payment_import_type"
        save_as: "ctype"
        values:
          name: "Test Bank CSV Type"
          code: "TBCT001"
          date_column: "date"
          partner_bank_account_column: "account_number"
          amount_column: "amount"

      - step: "Assert type created"
        action: "assert"
        target: "ctype"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Test Bank CSV Type"
          file_type:
            type: "value"
            expected: "csv"
          auto_post:
            type: "value"
            expected: false
          journal_selection_method:
            type: "value"
            expected: "domain"
          account_selection_method:
            type: "value"
            expected: "domain"
          partner_matching_method:
            type: "value"
            expected: "bank"
          usage_matching_method:
            type: "value"
            expected: "none"

  - name: "Edit Customer Payment Import Type Name"
    steps:
      - step: "Create type"
        action: "create"
        model: "customer_payment_import_type"
        save_as: "ctype"
        values:
          name: "Editable Type"
          code: "TBCT002"
          date_column: "date"
          partner_bank_account_column: "account_number"
          amount_column: "amount"

      - step: "Write new name"
        action: "write"
        target: "ctype"
        values:
          name: "Updated Type Name"
          auto_post: true

      - step: "Assert name and auto_post updated"
        action: "assert"
        target: "ctype"
        asserts:
          name:
            type: "value"
            expected: "Updated Type Name"
          auto_post:
            type: "value"
            expected: true

  - name: "Customer Payment Import Type - Exclusion columns default empty"
    steps:
      - step: "Create type without exclusion configuration"
        action: "create"
        model: "customer_payment_import_type"
        save_as: "ctype"
        values:
          name: "No Exclusion Test Type"
          code: "TBCT004"
          date_column: "date"
          partner_bank_account_column: "account_number"
          amount_column: "amount"

      - step: "Assert exclusion fields are empty by default"
        action: "assert"
        target: "ctype"
        asserts:
          exclude_column:
            type: "value"
            operator: "is_falsy"
          exclude_values:
            type: "value"
            operator: "is_falsy"

  - name: "Customer Payment Import Type - Exclusion columns can be configured"
    steps:
      - step: "Create type with exclusion configuration"
        action: "create"
        model: "customer_payment_import_type"
        save_as: "ctype"
        values:
          name: "Exclusion Config Test Type"
          code: "TBCT005"
          date_column: "date"
          partner_bank_account_column: "account_number"
          amount_column: "amount"
          exclude_column: "description"
          exclude_values: "Saldo Awal, Saldo Akhir"

      - step: "Assert exclusion fields persisted"
        action: "assert"
        target: "ctype"
        asserts:
          exclude_column:
            type: "value"
            expected: "description"
          exclude_values:
            type: "value"
            expected: "Saldo Awal, Saldo Akhir"

  - name: "Delete Customer Payment Import Type"
    steps:
      - step: "Create type"
        action: "create"
        model: "customer_payment_import_type"
        save_as: "ctype"
        values:
          name: "Deletable Type"
          code: "TBCT003"
          date_column: "date"
          partner_bank_account_column: "account_number"
          amount_column: "amount"

      - step: "Delete type"
        action: "call"
        target: "ctype"
        method: "unlink"

      - step: "Verify type deleted"
        action: "search"
        model: "customer_payment_import_type"
        domain: [["code", "=", "TBCT003"]]
        save_as: "result"
        expect_count: 0

  - name: "Customer Payment Import Type - Usage account mapping can be configured"
    steps:
      - step: "Create the Enrollment receivable account"
        action: "create"
        model: "account.account"
        save_as: "account_enrollment"
        values:
          name: "Piutang Enrollment - Type Config"
          code: "TSTAR01"
          user_type_id: "REF: account.data_account_type_receivable"
          reconcile: true

      - step: "Create the Admission receivable account"
        action: "create"
        model: "account.account"
        save_as: "account_admission"
        values:
          name: "Piutang Admission - Type Config"
          code: "TSTAR02"
          user_type_id: "REF: account.data_account_type_receivable"
          reconcile: true

      - step: "Create the Uang Sekolah bank account usage"
        action: "create"
        model: "res_partner_bank_usage"
        save_as: "usage_school"
        values:
          name: "Uang Sekolah - Type Config"
          code: "TSTUS01"

      - step: "Create the Uang Pangkal bank account usage"
        action: "create"
        model: "res_partner_bank_usage"
        save_as: "usage_entrance"
        values:
          name: "Uang Pangkal - Type Config"
          code: "TSTUS02"

      - step: "Create type with two usage mapping lines"
        action: "create"
        model: "customer_payment_import_type"
        save_as: "ctype"
        values:
          name: "Usage Mapping Config Test Type"
          code: "UMCT001"
          date_column: "date"
          partner_bank_account_column: "account_number"
          amount_column: "amount"
          usage_matching_method: "bank_account_column"
          account_mapping_ids:
            - - 0
              - 0
              - sequence: 10
                usage_id: "REC: usage_school.id"
                account_id: "REC: account_enrollment.id"
            - - 0
              - 0
              - sequence: 20
                usage_id: "REC: usage_entrance.id"
                account_id: "REC: account_admission.id"

      - step: "Assert the usage configuration persisted"
        action: "assert"
        target: "ctype"
        asserts:
          account_mapping_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

      - step: "Get the Uang Sekolah mapping line"
        action: "search"
        model: "customer_payment_import_type.account_mapping"
        domain:
          - ["type_id", "=", "REC: ctype.id"]
          - ["usage_id", "=", "REC: usage_school.id"]
        save_as: "mapping_school"
        expect_count: 1

      - step: "Assert the mapping line points at the Enrollment account"
        action: "assert"
        target: "mapping_school"
        asserts:
          sequence:
            type: "value"
            expected: 10
          account_id:
            type: "m2o"
            expected: "REC: account_enrollment.id"

  - name:
      "Customer Payment Import Type - Mapping account choices follow the Type account
      configurator"
    steps:
      - step: "Create the only account the configurator will allow"
        action: "create"
        model: "account.account"
        save_as: "account_allowed"
        values:
          name: "Piutang Allowed - Configurator"
          code: "TSTAR03"
          user_type_id: "REF: account.data_account_type_receivable"
          reconcile: true

      - step: "Create a bank account usage"
        action: "create"
        model: "res_partner_bank_usage"
        save_as: "usage_school"
        values:
          name: "Uang Sekolah - Configurator"
          code: "TSTUS03"

      - step: "Create type whose account domain matches that single account"
        action: "create"
        model: "customer_payment_import_type"
        save_as: "ctype"
        values:
          name: "Usage Mapping Configurator Test Type"
          code: "UMCT002"
          date_column: "date"
          partner_bank_account_column: "account_number"
          amount_column: "amount"
          account_selection_method: "domain"
          account_domain:
            'EVAL: "[(''id'', ''='', %d)]" % registry[''account_allowed''].id'
          usage_matching_method: "bank_account_column"
          account_mapping_ids:
            - - 0
              - 0
              - sequence: 10
                usage_id: "REC: usage_school.id"
                account_id: "REC: account_allowed.id"

      - step: "Get the mapping line"
        action: "search"
        model: "customer_payment_import_type.account_mapping"
        domain:
          - ["type_id", "=", "REC: ctype.id"]
        save_as: "mapping_line"
        expect_count: 1

      - step: "Assert the line only offers the account allowed by the Type"
        action: "assert"
        target: "mapping_line"
        asserts:
          allowed_account_ids:
            type: "m2m"
            check: "count"
            expected_count: 1

  - name:
      "Customer Payment Import Type - Two mapping lines with the same usage are rejected"
    steps:
      - step: "Create the receivable account used by both mapping lines"
        action: "create"
        model: "account.account"
        save_as: "account_dup"
        values:
          name: "Piutang Duplicate Usage"
          code: "TSTAR04"
          user_type_id: "REF: account.data_account_type_receivable"
          reconcile: true

      - step: "Create a bank account usage"
        action: "create"
        model: "res_partner_bank_usage"
        save_as: "usage_school"
        values:
          name: "Uang Sekolah - Duplicate"
          code: "TSTUS04"

      - step: "Creating a type whose two mapping lines share the same usage is rejected"
        action: "create"
        model: "customer_payment_import_type"
        values:
          name: "Duplicate Usage Test Type"
          code: "UMCT003"
          date_column: "date"
          partner_bank_account_column: "account_number"
          amount_column: "amount"
          usage_matching_method: "bank_account_column"
          account_mapping_ids:
            - - 0
              - 0
              - sequence: 10
                usage_id: "REC: usage_school.id"
                account_id: "REC: account_dup.id"
            - - 0
              - 0
              - sequence: 20
                usage_id: "REC: usage_school.id"
                account_id: "REC: account_dup.id"
        expect_error:
          type: "ValidationError"

  - name:
      "Customer Payment Import Type - Manual amount format with equal thousand and
      decimal separators is rejected"
    steps:
      - step:
          "Creating a manual amount format type whose thousand and decimal separators
          are both dot is rejected"
        action: "create"
        model: "customer_payment_import_type"
        values:
          name: "Amount Separator Conflict Test Type"
          code: "AMFT001"
          date_column: "date"
          partner_bank_account_column: "account_number"
          amount_column: "amount"
          amount_format: "manual"
          amount_thousand_separator: "dot"
          amount_decimal_separator: "dot"
        expect_error:
          type: "ValidationError"

  - name:
      "Customer Payment Import Type - Bank matching method without its source column is
      rejected"
    steps:
      - step:
          "Creating a type with Partner Matching Method = Bank Account and an empty
          Partner Bank Account Column is rejected"
        action: "create"
        model: "customer_payment_import_type"
        values:
          name: "Partner Matching Without Column Test Type"
          code: "PMWC001"
          date_column: "date"
          amount_column: "amount"
          partner_matching_method: "bank"
        expect_error:
          type: "ValidationError"

  - name:
      "Customer Payment Import Type - Bank Account Column usage method without its
      source column is rejected"
    steps:
      - step:
          "Creating a type with Usage Matching Method = From Bank Account Column and an
          empty Partner Bank Account Column is rejected"
        action: "create"
        model: "customer_payment_import_type"
        values:
          name: "Usage Matching Without Column Test Type"
          code: "UMWC001"
          date_column: "date"
          amount_column: "amount"
          usage_matching_method: "bank_account_column"
        expect_error:
          type: "ValidationError"

  - name:
      "Customer Payment Import Type - Usage account mapping unreachable under No Usage
      is rejected"
    steps:
      - step: "Create the account used by the unreachable mapping line"
        action: "create"
        model: "account.account"
        save_as: "account_unreachable"
        values:
          name: "Piutang Unreachable Mapping"
          code: "TSTAR05"
          user_type_id: "REF: account.data_account_type_receivable"
          reconcile: true

      - step: "Create a bank account usage"
        action: "create"
        model: "res_partner_bank_usage"
        save_as: "usage_unreachable"
        values:
          name: "Uang Sekolah - Unreachable"
          code: "TSTUS05"

      - step: "Creating a No Usage type with an Usage Account Mapping line is rejected"
        action: "create"
        model: "customer_payment_import_type"
        values:
          name: "Unreachable Mapping Test Type"
          code: "UMUR001"
          date_column: "date"
          partner_bank_account_column: "account_number"
          amount_column: "amount"
          usage_matching_method: "none"
          account_mapping_ids:
            - - 0
              - 0
              - sequence: 10
                usage_id: "REC: usage_unreachable.id"
                account_id: "REC: account_unreachable.id"
        expect_error:
          type: "ValidationError"
