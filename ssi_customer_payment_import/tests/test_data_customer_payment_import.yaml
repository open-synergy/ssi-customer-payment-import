  - name: "Customer Payment Import Data - Error line goes to error state without raising"
    steps:
      - step: "Create bank journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Test Bank Journal Error Line"
          type: "bank"

      - step: "Create type"
        action: "create"
        model: "customer_payment_import_type"
        save_as: "ctype"
        values:
          name: "Error Line Test Type"
          code: "ERLT001"
          date_column: "date"
          partner_bank_account_column: "account_number"
          amount_column: "amount"

      - step: "Create import document"
        action: "create"
        model: "customer_payment_import"
        save_as: "import_doc"
        values:
          type_id: "REC: ctype.id"
          journal_id: "REC: journal.id"

      - step: "Create data line with unregistered bank account number"
        action: "create"
        model: "customer_payment_import.data"
        save_as: "data_line"
        values:
          import_id: "REC: import_doc.id"
          sequence: 1
          data: '{"date": "2026-04-01", "account_number": "9990000001", "amount": "1000"}'

      - step: "Process the data line via the queue entry point"
        action: "call"
        target: "data_line"
        method: "_process_payment"

      - step: "Assert data line ended in error state without raising"
        action: "assert"
        target: "data_line"
        asserts:
          state:
            type: "value"
            expected: "error"
          error_message:
            type: "value"
            operator: "is_truthy"
          payment_id:
            type: "value"
            operator: "is_falsy"

  - name: "Customer Payment Import Data - Edit raw data then retry resolves the line"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Edit Retry Test Partner"
          is_company: true

      - step: "Create partner bank account"
        action: "create"
        model: "res.partner.bank"
        save_as: "partner_bank"
        values:
          acc_number: "9990000002"
          partner_id: "REC: partner.id"

      - step: "Create bank journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Test Bank Journal Edit Retry"
          type: "bank"

      - step: "Create type"
        action: "create"
        model: "customer_payment_import_type"
        save_as: "ctype"
        values:
          name: "Edit Retry Test Type"
          code: "ERLT002"
          date_column: "date"
          partner_bank_account_column: "account_number"
          amount_column: "amount"

      - step: "Create import document"
        action: "create"
        model: "customer_payment_import"
        save_as: "import_doc"
        values:
          type_id: "REC: ctype.id"
          journal_id: "REC: journal.id"

      - step: "Create data line with wrong (unregistered) account number"
        action: "create"
        model: "customer_payment_import.data"
        save_as: "data_line"
        values:
          import_id: "REC: import_doc.id"
          sequence: 1
          data: '{"date": "2026-04-02", "account_number": "0000000000", "amount": "5000"}'

      - step: "Process the data line, expect error"
        action: "call"
        target: "data_line"
        method: "_process_payment"

      - step: "Assert data line is in error state"
        action: "assert"
        target: "data_line"
        asserts:
          state:
            type: "value"
            expected: "error"

      - step: "Correct the raw data via the edit-data wizard"
        action: "wizard"
        model: "edit_customer_payment_import_data"
        target: "data_line"
        values:
          data:
            '{"date": "2026-04-02", "account_number": "9990000002", "amount":
            "5000"}'
        method: "action_confirm"

      - step: "Assert data line back to draft with corrected data"
        action: "assert"
        target: "data_line"
        asserts:
          state:
            type: "value"
            expected: "draft"
          error_message:
            type: "value"
            operator: "is_falsy"

      - step: "Retry the corrected line"
        action: "call"
        target: "data_line"
        method: "action_retry"

      - step: "Assert data line resolved to done with a payment linked"
        action: "assert"
        target: "data_line"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"
          payment_id:
