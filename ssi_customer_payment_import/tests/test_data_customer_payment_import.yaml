  - name:
      "Customer Payment Import Data - _process_payment raises on unknown bank account"
    steps:
      - step: "Create bank journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Test Bank Journal Error Line"
          type: "bank"

      - step: "Create type"
        action: "create"
        model: "customer_payment_import_type"
        save_as: "ctype"
        values:
          name: "Error Line Test Type"
          code: "ERLT001"
          date_column: "date"
          partner_bank_account_column: "account_number"
          amount_column: "amount"

      - step: "Create import document"
        action: "create"
        model: "customer_payment_import"
        save_as: "import_doc"
        values:
          type_id: "REC: ctype.id"
          journal_id: "REC: journal.id"

      - step: "Create data line with unregistered bank account number"
        action: "create"
        model: "customer_payment_import.data"
        save_as: "data_line"
        values:
          import_id: "REC: import_doc.id"
          sequence: 1
          data:
            '{"date": "2026-04-01", "account_number": "9990000001", "amount": "1000"}'

      - step: "Process the data line via the queue entry point, expect it to raise"
        action: "call"
        target: "data_line"
        method: "_process_payment"
        expect_error:
          type: "UserError"
          message_contains: "No partner found"

  - name: "Customer Payment Import Data - _write_error_result records the error"
