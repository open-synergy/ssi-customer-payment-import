        save_as: "import_doc"
        values:
          type_id: "REC: ctype.id"
          journal_id: "REC: journal.id"

      - step: "Create a draft data line"
        action: "create"
        model: "customer_payment_import.data"
        save_as: "data_line"
        values:
          import_id: "REC: import_doc.id"
          sequence: 1

      - step: "Call _write_error_result directly with a message"
        action: "call"
        target: "data_line"
        method: "_write_error_result"
        args:
          - "Simulated failure for _write_error_result test"

      - step: "Assert the line recorded the error"
        action: "assert"
        target: "data_line"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "error"
          error_message:
            type: "value"
            expected: "Simulated failure for _write_error_result test"

  - name: "Customer Payment Import Data - Retry without queue_job_id enqueues a new job"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Retry New Job Test Partner"
          is_company: true

      - step: "Create partner bank account"
        action: "create"
        model: "res.partner.bank"
        save_as: "partner_bank"
        values:
          acc_number: "9990000020"
          partner_id: "REC: partner.id"

      - step: "Create bank journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Test Bank Journal Retry New Job"
          type: "bank"

      - step: "Create type"
        action: "create"
        model: "customer_payment_import_type"
        save_as: "ctype"
        values:
          name: "Retry New Job Test Type"
          code: "ERLT016"
          date_column: "date"
          partner_bank_account_column: "account_number"
          amount_column: "amount"

      - step: "Create import document"
        action: "create"
        model: "customer_payment_import"
        save_as: "import_doc"
        values:
          type_id: "REC: ctype.id"
          journal_id: "REC: journal.id"

      - step: "Create error data line without a queue_job_id, valid data"
        action: "create"
        model: "customer_payment_import.data"
        save_as: "data_line"
        values:
          import_id: "REC: import_doc.id"
          sequence: 1
          state: "error"
          error_message: "Sample error before retry"
          data:
            '{"date": "2026-04-07", "account_number": "9990000020", "amount": "6000"}'

      - step: "Retry the line, job runs inline"
        action: "call"
        target: "data_line"
        method: "action_retry"
        context:
          queue_job__no_delay: true

      - step:
          "Assert the line resolved to done with a payment (queue_job_id stays empty:
          `queue_job__no_delay` runs the job body inline without ever storing a
          queue.job row)"
        action: "assert"
        target: "data_line"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"
          error_message:
            type: "value"
            operator: "is_falsy"
